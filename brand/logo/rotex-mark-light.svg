  <path d="M 0,0 L 0,-36 Q 19,-27 15,-12 Z" fill="#A8420D"/>
  <path d="M 0,0 L 0,-36 Q 19,-27 15,-12 Z" fill="#A8420D" opacity="0.85" transform="rotate(120)"/>
  <path d="M 0,0 L 0,-36 Q 19,-27 15,-12 Z" fill="#A8420D" opacity="0.68" transform="rotate(240)"/>
  <circle r="4.2" fill="#8A3A0A"/>
</g>
</svg>
