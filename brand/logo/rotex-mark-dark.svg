<svg width="512" height="512" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Rotex logo mark — dark theme</title>
<desc id="desc">Three tapered blades radiating from a center point, decreasing in opacity to suggest rotation, in brightened orange for dark backgrounds.</desc>
<g transform="translate(60,62) scale(1.42)">
  <path d="M 0,0 L 0,-36 Q 19,-27 15,-12 Z" fill="#FF8A3D"/>
  <path d="M 0,0 L 0,-36 Q 19,-27 15,-12 Z" fill="#FF8A3D" opacity="0.80" transform="rotate(120)"/>
  <path d="M 0,0 L 0,-36 Q 19,-27 15,-12 Z" fill="#FF8A3D" opacity="0.68" transform="rotate(240)"/>
  <circle r="4.2" fill="#FFC299"/>
</g>
</svg>
