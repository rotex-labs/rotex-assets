name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SVGs well-formed, files under 2 MB
        run: python3 scripts/check-assets.py
